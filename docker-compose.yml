version: '3.8'

services:
  jenkins:
    build: ./jenkins-setup
    container_name: jenkins
    restart: unless-stopped
    user: root                          # needed for socket access
    ports:
      - "8080:8080"
      - "50000:50000"                   # agent JNLP port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # KEY: socket binding
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - jenkins-net

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins-net:
    driver: bridge