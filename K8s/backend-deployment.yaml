apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
    tier: api

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        tier: api

    spec:
      terminationGracePeriodSeconds: 10

      containers:
        - name: backend

          # 🔥 FIXED REGION
          image: 730024653391.dkr.ecr.ap-south-1.amazonaws.com/backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8086

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          # 🔥 REDUCED MEMORY (CRITICAL)
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # 🔥 FASTER STARTUP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10